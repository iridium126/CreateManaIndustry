pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Sinytra"
            url = "https://maven.sinytra.org/"
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = providers.gradleProperty('mod_id').get()

// Include Loom only if either named artifact is absent, or regeneration is requested.
apply from: file('gradle/remapped-libs.gradle')
