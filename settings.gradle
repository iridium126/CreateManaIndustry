pluginManagement {
    plugins {
        id 'net.neoforged.moddev' version "${moddev_version}"
        id 'org.sinytra.adapter.userdev' version "${sinytra_adapter_version}"
        id 'net.fabricmc.fabric-loom-remap' version "${loom_remap_version}"
        id 'org.gradle.toolchains.foojay-resolver-convention' version "${foojay_resolver_version}"
    }
    repositories {
        gradlePluginPortal()
        maven {
            name = "Sinytra"
            url = "https://maven.sinytra.org/"
            content { includeGroupByRegex 'org\\.sinytra(\\..*)?' }
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
            content { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = providers.gradleProperty('mod_id').get()

// Include Loom only if either named artifact is absent, or regeneration is requested.
apply from: file('gradle/remapped-libs.gradle')
