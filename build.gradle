plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'org.sinytra.adapter.userdev' version '1.2.1-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper) { distributionType = Wrapper.DistributionType.BIN }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', '**/*.validation.json', '**/.cache/**')
}

apply from: file('gradle/repositories.gradle')
apply from: file('gradle/packaging.gradle')

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

apply from: file('gradle/dependencies.gradle')

// Trickster's original jar is installed as a mod, not a duplicate launch-classpath entry.
def copyTricksterToRunMods = tasks.register('copyTricksterToRunMods', Copy) {
    from(configurations.tricksterLocalRuntime)
    into(layout.projectDirectory.dir('run/mods'))
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    // ModDev writes the bootstrap classpath to a text file; retain its producer explicitly.
    dependsOn(copyTricksterToRunMods, tasks.named('bootstrapJar'))
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                        neo_version: neo_version, loader_version_range: loader_version_range,
                        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties(replacements)
    expand(replacements)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/resources/modMetadata'))
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven { url = layout.projectDirectory.dir('repo').asFile.toURI() }
    }
}
idea.module {
    downloadSources = true
    downloadJavadoc = true
}
apply from: file('gradle/verification.gradle')
