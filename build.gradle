plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    // Used to attach the clean mapped Minecraft artifact to run configurations
    // Find the latest version at https://maven.su5ed.dev/#/releases/org/sinytra/adapter/userdev/
    id 'org.sinytra.adapter.userdev' version '1.2.1-SNAPSHOT'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    // Add here additional repositories if required by some of the dependencies below.
    mavenLocal()
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    // Make sure to add this to the pluginManagement.repositories block in settings.gradle as well
    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Ithundxr"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "WispForest"
        url = "https://maven.wispforest.io/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
    ivy {
        url = uri("https://ci.blamejared.com/job/petrakat/job/Hexcasting/job/1.21/53/artifact/Neoforge/build/libs")
        
        patternLayout {
            artifact "[artifact].[ext]"
        }
        metadataSources {
            artifact() // 直接按文件名匹配，不读取pom/ivy元数据
        }
    }
    ivy {
        url = uri("https://ci.blamejared.com/job/petrakat/job/PAUCAL/job/1.21/27/artifact/Neoforge/build/libs")
        
        patternLayout {
            artifact "[artifact].[ext]"
        }
        metadataSources {
            artifact() // 直接按文件名匹配，不读取pom/ivy元数据
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The persistence unit tests compile/run against the mod's own classes plus
// the (registry-free) Minecraft classes — ModDevGradle only wires the main
// source set, so extend the test classpaths from the main ones.
configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
    // Sodium's CurseForge artifact is a NeoForge loader jar whose named
    // implementation is nested under META-INF/jarjar.
    sodiumDistribution
    compileOnly.extendsFrom sodiumDistribution
}

// Sodium's named implementation jar is cached outside build/ so a normal
// clean does not force Gradle to unpack the same dependency again. The
// resolved outer distribution remains a task input, so changing its version
// or contents invalidates and refreshes this cache automatically.
def sodiumCoreJar = project.file(".gradle/sodium/sodium-core.jar")

// Build Voxy from the upstream multiversion branch and keep the resulting jar
// outside build/ so a normal `clean` does not throw away this relatively
// expensive optional dependency build.
def voxyRepoUrl = "https://github.com/m3t4f1v3/voxy.git"
def voxyRepoBranch = "multiversion"
def voxyMinecraftVersion = "1.21.1"
def voxyLoader = "neoforge"
def voxyVersion = providers.gradleProperty("voxy_version").orElse("0.2.15-beta").get()
def voxyArtifactName = "voxy-${voxyVersion}+${voxyMinecraftVersion}-${voxyLoader}.jar"
def voxyCacheRoot = project.file(".gradle/voxy")
def voxySourceDir = project.file("${voxyCacheRoot}/source")
def voxyCachedJar = project.file("${voxyCacheRoot}/artifacts/${voxyArtifactName}")
def voxyUpstreamJar = project.file(
        "${voxySourceDir}/versions/${voxyMinecraftVersion}-${voxyLoader}/build/libs/${voxyArtifactName}"
)
def voxyRebuild = providers.gradleProperty("voxy_rebuild")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

// The clone is deliberately shallow, single-branch, and tagless. A cached
// artifact is checked first so subsequent builds do not even need to clone or
// invoke Voxy's Gradle build again.
def cloneVoxy = tasks.register("cloneVoxy", Exec) {
    group = "voxy"
    description = "Clones Voxy's multiversion branch when its cached jar is absent"
    inputs.property("repository", voxyRepoUrl)
    inputs.property("branch", voxyRepoBranch)
    outputs.dir(voxySourceDir)
    onlyIf {
        if (voxyCachedJar.isFile() && !voxyRebuild) {
            return false
        }
        if (voxySourceDir.exists() && !new File(voxySourceDir, ".git").isDirectory()) {
            throw new GradleException("Voxy cache path is not a Git checkout: ${voxySourceDir}")
        }
        return !voxySourceDir.isDirectory()
    }
    doFirst {
        voxyCacheRoot.mkdirs()
    }
    workingDir(voxyCacheRoot)
    commandLine(
            "git", "clone",
            "--branch", voxyRepoBranch,
            "--single-branch",
            "--depth", "1",
            "--no-tags",
            voxyRepoUrl,
            voxySourceDir.absolutePath
    )
}

def voxySettingsFile = new File(voxySourceDir, "settings.gradle.kts")
def voxyStonecutterFile = new File(voxySourceDir, "stonecutter.gradle.kts")
def voxyPatchMarker = new File(voxyCacheRoot, "neoforge-only.marker")
def voxyActiveMarker = new File(voxyCacheRoot, "neoforge-active.marker")

// The upstream checkout is a multi-version Stonecutter project. Restrict the
// cached checkout's generated project model to the one artifact CMI consumes;
// otherwise Voxy configures unrelated Fabric/Forge variants before reaching
// NeoForge and needlessly downloads their toolchains.
def prepareVoxy = tasks.register("prepareVoxy") {
    group = "voxy"
    description = "Restricts the cached Voxy checkout to its NeoForge 1.21.1 variant"
    dependsOn(cloneVoxy)
    inputs.file(voxySettingsFile)
    inputs.file(voxyStonecutterFile)
    outputs.file(voxyPatchMarker)
    outputs.upToDateWhen { !voxyRebuild && voxyPatchMarker.isFile() }
    onlyIf { voxyRebuild || !voxyCachedJar.isFile() }
    doLast {
        if (!voxySettingsFile.isFile() || !voxyStonecutterFile.isFile()) {
            throw new GradleException("Voxy checkout is missing its Stonecutter settings")
        }

        def settingsText = voxySettingsFile.getText("UTF-8")
        def targetMatch = '        match("1.21.1", "neoforge")'
        if (!settingsText.contains(targetMatch)) {
            def reducedSettings = settingsText.replaceFirst(
                    /(?m)^\s*match\("1\.20\.1",\s*"fabric",\s*"forge"\)\s*\r?\n\s*match\("1\.21\.1",\s*"fabric",\s*"neoforge"\)/,
                    targetMatch
            )
            if (reducedSettings == settingsText) {
                throw new GradleException("Unexpected Voxy settings layout; cannot select 1.21.1 NeoForge")
            }
            settingsText = reducedSettings
        }
        settingsText = settingsText.replaceFirst(
                /(?m)^\s*vcsVersion\s*=\s*"[^"]+"\s*$/,
                '        vcsVersion = "1.21.1-neoforge"'
        )
        if (settingsText.findAll(/(?m)^\s*match\(/).size() != 1 || !settingsText.contains(targetMatch)) {
            throw new GradleException("Voxy settings did not reduce to exactly the NeoForge 1.21.1 variant")
        }

        def stonecutterText = voxyStonecutterFile.getText("UTF-8")
        if (!stonecutterText.contains('active("1.21.1-neoforge")')) {
            def targetStonecutterText = stonecutterText.replaceFirst(
                    /active\("1\.20\.1-fabric"\)/,
                    'active("1.21.1-neoforge")'
            )
            if (targetStonecutterText == stonecutterText) {
                throw new GradleException("Unexpected Voxy Stonecutter layout; cannot activate NeoForge 1.21.1")
            }
            stonecutterText = targetStonecutterText
        }

        voxySettingsFile.setText(settingsText, "UTF-8")
        voxyStonecutterFile.setText(stonecutterText, "UTF-8")
        voxyPatchMarker.parentFile.mkdirs()
        voxyPatchMarker.setText("target=${voxyMinecraftVersion}-${voxyLoader}\n", "UTF-8")
    }
}

def voxyGradleCommand = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? ["cmd", "/c", "gradlew.bat"]
        : ["./gradlew"]
def voxyGradleArguments = ["--no-daemon", "--console=plain", "--configure-on-demand"]
if (voxyRebuild) {
    voxyGradleArguments += "--rerun-tasks"
}

// Stonecutter keeps the active shared sources in the checkout. Refresh that
// active view in a separate invocation before asking for the variant jar;
// combining the switch and compile tasks in one Gradle invocation can trigger
// Gradle's implicit-output validation in Stonecutter 0.9.4.
def activateVoxy = tasks.register("activateVoxy", Exec) {
    group = "voxy"
    description = "Refreshes Voxy's active shared sources for NeoForge 1.21.1"
    dependsOn(prepareVoxy)
    inputs.file(voxySettingsFile)
    inputs.file(voxyStonecutterFile)
    outputs.file(voxyActiveMarker)
    outputs.upToDateWhen { !voxyRebuild && voxyActiveMarker.isFile() }
    onlyIf { voxyRebuild || (!voxyCachedJar.isFile() && !voxyActiveMarker.isFile()) }
    workingDir(voxySourceDir)
    commandLine(*(voxyGradleCommand + voxyGradleArguments + [
            "stonecutterSwitchTo${voxyMinecraftVersion}-${voxyLoader}"
    ]))
    doLast {
        voxyActiveMarker.parentFile.mkdirs()
        voxyActiveMarker.setText("target=${voxyMinecraftVersion}-${voxyLoader}\n", "UTF-8")
    }
}

def buildVoxy = tasks.register("buildVoxy", Exec) {
    group = "voxy"
    description = "Builds Voxy's NeoForge 1.21.1 jar from the cached multiversion checkout"
    dependsOn(activateVoxy)
    inputs.property("minecraftVersion", voxyMinecraftVersion)
    inputs.property("loader", voxyLoader)
    inputs.property("version", voxyVersion)
    outputs.file(voxyUpstreamJar)
    outputs.upToDateWhen { !voxyRebuild && voxyUpstreamJar.isFile() }
    onlyIf {
        voxyRebuild || (!voxyCachedJar.isFile() && !voxyUpstreamJar.isFile())
    }
    workingDir(voxySourceDir)
    commandLine(*(voxyGradleCommand + voxyGradleArguments + [
            ":${voxyMinecraftVersion}-${voxyLoader}:jar"
    ]))
}

def cacheVoxy = tasks.register("cacheVoxy") {
    group = "voxy"
    description = "Copies the Voxy NeoForge 1.21.1 jar into the persistent project cache"
    dependsOn(buildVoxy)
    inputs.file(voxyUpstreamJar)
    outputs.file(voxyCachedJar)
    outputs.upToDateWhen { !voxyRebuild && voxyCachedJar.isFile() }
    onlyIf { voxyRebuild || !voxyCachedJar.isFile() }
    doLast {
        if (!voxyUpstreamJar.isFile()) {
            throw new GradleException(
                    "Voxy build completed without producing the expected artifact: ${voxyUpstreamJar}"
            )
        }
        voxyCachedJar.parentFile.mkdirs()
        java.nio.file.Files.copy(
                voxyUpstreamJar.toPath(),
                voxyCachedJar.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

dependencies {
    // region3d persistence unit tests (pure JVM; plan P0/P2/P3). Test-only —
    // never published; no legacy regionlib dependency is introduced.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    implementation "curse.maven:create-328085:7963363"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}"
    implementation "maven.modrinth:3KUWeVhG:dqlL6EvF" // Veil
    compileOnly "curse.maven:irisshaders-455508:8242804"
    sodiumDistribution "curse.maven:sodium-394468:8756580"
    compileOnly files(sodiumCoreJar)
    // Voxy runtime adapter: compile against the locally built/cached artifact,
    // never bundle it — Voxy remains a user-installed optional dependency.
    compileOnly files(voxyCachedJar)
    // GLSL AST transformation for the shader-pack particle path. Provided at runtime
    // Provided by iris-veil-compat (JarJar) -- compile against 2.0.1, never bundle (AGPL).
    compileOnly "io.github.douira:glsl-transformer:2.0.1"
    compileOnly "curse.maven:iris-veil-compat-1541252:8280410"
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    implementation "hexcasting:hexcasting-neoforge-1.21.1-0.12.0-devel-pre-53@jar"
    localRuntime "paucal:paucal-0.7.1-pre-27+1.21.1-neoforge@jar"
    localRuntime "curse.maven:caelus-308989:5694215"
    implementation "curse.maven:inline-971167:6556868"
    localRuntime "curse.maven:patchouli-306770:7730942"
    localRuntime "curse.maven:cloth-config-348521:5729127"
    localRuntime "curse.maven:architectury-api-419699:5786327"
    localRuntime "curse.maven:kotlin-for-forge-351264:7471280"

    implementation "curse.maven:ars-nouveau-401955:8517890"
    localRuntime "curse.maven:curios-309927:6529130"
    localRuntime "curse.maven:geckolib-388172:8350073"
    //localRuntime "curse.maven:accessories-compat-layer-1315611:7585673"

    implementation "maven.modrinth:T8bvmqVZ:ufzJ4rp9" // Create: Bits 'n' Bobs
    implementation "curse.maven:azimuth-api-1466331:8661574"
    localRuntime "curse.maven:strut-your-stuff-1486746:8301563"

    localRuntime "curse.maven:accessories-938917:7583320"
    //localRuntime "curse.maven:owo-lib-532610:6785734" 需要更新至0.13.0 alpha.15
    localRuntime "curse.maven:lithostitched-936015:8321754"

    // Add Connector to the launch classpath and for compile-time access
    compileOnly "org.sinytra:connector:2.0.0-beta.12+1.21.1"
    additionalRuntimeClasspath "org.sinytra:connector:2.0.0-beta.12+1.21.1"
    // Add FFAPI dependency
    implementation "curse.maven:forgified-fabric-api-889079:7658611"
    // Compile-time deps for Trickster's transitive dependencies (needed for remapped jar)
    // The raw fabric-api artifact is intermediary-mapped; use the loom-remap
    // export (Mojang-mapped, same as namedTrickster) so fabric types resolve
    // with Mojang signatures.
    //
    // Prefer the vendored named jars (loom-remap/remapped-libs/) when present so
    // the :loom-remap subproject is skipped — no Minecraft download / re-remap on
    // every build. Pass -PregenerateRemap (or delete the vendored jars) to re-remap
    // through the subproject.
    def namedTricksterJar = project.file("loom-remap/remapped-libs/trickster-${trickster_project_id}-${trickster_file_id}-named.jar")
    def namedFabricApiJar = project.file("loom-remap/remapped-libs/fabric-api-${fabric_api_version}-named.jar")
    boolean useVendoredNamedJars = !project.hasProperty("regenerateRemap")
            && namedTricksterJar.exists() && namedFabricApiJar.exists()
    if (useVendoredNamedJars) {
        compileOnly files(namedTricksterJar, namedFabricApiJar)
    } else {
        compileOnly(project(path: ":loom-remap", configuration: "namedFabricApi"))
        compileOnly(project(path: ":loom-remap", configuration: "namedTrickster"))
    }
    compileOnly "io.vavr:vavr:0.10.4"
    // Endec API for custom FragmentType endecs (runtime endec is bundled in owo-lib, required by trickster)
    compileOnly "io.wispforest:endec:0.1.5.1"
    localRuntime "curse.maven:trickster-${trickster_project_id}:${trickster_file_id}"
    runtimeOnly "curse.maven:cicada-989574:7068950"
    runtimeOnly "curse.maven:lavender-api-962916:6107175"
    runtimeOnly "curse.maven:cardinal-components-api-318449:7250871"
}

def sodiumDistributionFiles = configurations.getByName("sodiumDistribution").files

// CurseForge's Sodium NeoForge jar is a loader/container jar. Extract its
// nested named implementation automatically so private Sodium classes remain
// available to compileJava without committing a copied core jar to libs/ or
// rebuilding it after every clean.
def extractSodiumCoreJar = tasks.register("extractSodiumCoreJar") {
    group = "sodium"
    description = "Extracts and caches Sodium's nested named implementation jar"
    inputs.files(sodiumDistributionFiles)
    outputs.file(sodiumCoreJar)

    doLast {
        def distribution = sodiumDistributionFiles
                .find { it.name.toLowerCase(java.util.Locale.ROOT).contains("sodium") }
        if (distribution == null) {
            throw new GradleException("Could not resolve the Sodium CurseForge distribution jar")
        }

        def output = sodiumCoreJar
        output.parentFile.mkdirs()
        def outer = new java.util.zip.ZipFile(distribution)
        try {
            def nested = outer.entries().find { entry ->
                !entry.directory
                        && entry.name.startsWith("META-INF/jarjar/net.caffeinemc.sodium-")
                        && entry.name.endsWith("-mod.jar")
            }
            if (nested == null) {
                throw new GradleException("Sodium distribution does not contain a nested named implementation jar: ${distribution}")
            }

            def input = outer.getInputStream(nested)
            try {
                def outputStream = new FileOutputStream(output)
                try {
                    input.transferTo(outputStream)
                } finally {
                    outputStream.close()
                }
            } finally {
                input.close()
            }
        } finally {
            outer.close()
        }
    }
}

tasks.named("compileJava") {
    dependsOn(extractSodiumCoreJar, cacheVoxy)
}
tasks.named("compileTestJava") {
    dependsOn(extractSodiumCoreJar, cacheVoxy)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// region3d persistence unit tests (plan §10.1): pure JVM, no game launch.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
