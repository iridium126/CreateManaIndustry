import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

abstract class AuditResolvedJar extends DefaultTask {
    // The report intentionally records this machine's resolved absolute path.
    @InputFile @PathSensitive(PathSensitivity.ABSOLUTE) abstract RegularFileProperty getBinary()
    @Input abstract Property<String> getCoordinate()
    @OutputFile abstract RegularFileProperty getReport()

    @TaskAction void audit() {
        def input = binary.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        input.withInputStream { stream ->
            byte[] block = new byte[65536]
            int count
            while ((count = stream.read(block)) != -1) digest.update(block, 0, count)
        }
        def output = report.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                coordinate: coordinate.get(), binary: input.absolutePath,
                sha256: digest.digest().encodeHex().toString()])) + '\n', 'UTF-8')
    }
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'shaderpack-samples' }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

// The normal reference tests include the companion; this probe exercises its absence.
def companion = cmiOptionalApiOutputs.sable.get().asFile
tasks.register('validatePackageSableAbsent', JavaExec) {
    group = 'verification'
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.testRuntimeClasspath.filter { it != companion }
    mainClass = 'com.iridium126.createmanaindustry.client.packages.world.PackageSableAbsentProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

def resolvedCreate = configurations.compileClasspath.incoming.artifacts.resolvedArtifacts.map { artifacts ->
    def matches = artifacts.findAll {
        def id = it.id.componentIdentifier
        id instanceof ModuleComponentIdentifier && id.group == 'curse.maven' && id.module == 'create-328085'
    }
    if (matches.size() != 1) throw new GradleException('Expected exactly one resolved Create binary')
    matches.first()
}
tasks.register('preparePackageNativeAudit', AuditResolvedJar) {
    group = 'verification'
    binary.set(layout.file(resolvedCreate.map { it.file }))
    coordinate.set(resolvedCreate.map { it.id.componentIdentifier.displayName })
    report.set(layout.buildDirectory.file('package-native/resolved-create.json'))
}

// Explicit, local eight-pack matrix. Normal tests/builds do not require third-party shader archives.
tasks.register('validateShaderPackSamples', Test) {
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'shaderpack-samples' }
    systemProperty 'cmi.shaderpack.samples', file('run/shaderpacks').absolutePath
    inputs.dir('run/shaderpacks')
    outputs.upToDateWhen { false }
}
