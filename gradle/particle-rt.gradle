// SDK-free normal builds embed a source-matched, developer-built native release.
def nativeSources = fileTree('native/particle_rt')
def nativeRelease = file('native/prebuilt/windows-x86_64')
def nativeResources = layout.buildDirectory.dir('generated/particleRtResources')
def nativeRoot = layout.projectDirectory.asFile
def nativeVersion = file('native/particle_rt/Version.h')
def resourceContract = file('gpu/particle-resources.json')
def sharedStormMath = file('src/main/resources/assets/createmanaindustry/shaders/particles/chunks/storm_home.glsl')
def prepareParticleRtResources = tasks.register('prepareParticleRtResources') {
    inputs.files(nativeSources)
    inputs.file(sharedStormMath)
    inputs.dir(nativeRelease)
    inputs.file(resourceContract)
    outputs.dir(nativeResources)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(new File(nativeRelease, 'manifest.json'))
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def contract = new groovy.json.JsonSlurper().parse(resourceContract)
        def header = '#pragma once\n// Generated from gpu/particle-resources.json.\n' + contract.constants.collect { key, value -> "#define CMI_RESOURCE_${key} ${value}\n" }.join('')
        if (new File(nativeRoot, 'native/particle_rt/ResourceLayout.h').getText('UTF-8').replace(String.valueOf((char)13), '') != header)
            throw new GradleException('Native resource layout is stale; regenerate and rebuild the native release.')
        (nativeSources.files.findAll { it.isFile() } + [resourceContract, sharedStormMath]).sort { nativeRoot.toPath().relativize(it.toPath()).toString().replace(java.io.File.separatorChar, '/' as char) }.each { input ->
            digest.update(nativeRoot.toPath().relativize(input.toPath()).toString().replace(java.io.File.separatorChar, '/' as char).getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(input.getText('UTF-8').replace(String.valueOf((char)13), '').getBytes('UTF-8'))
            digest.update((byte) 0)
        }
        def dll = new File(nativeRelease, 'CmiParticleRt.dll')
        def binaryDigest = java.security.MessageDigest.getInstance('SHA-256').digest(dll.bytes).encodeHex().toString()
        def layout = contract.constants.findAll { key, value ->
            key == 'ABI' || key.startsWith('STORM_') || key.startsWith('SPATIAL_') || key.startsWith('RT_')
        }
        if (metadata.layout != layout) throw new GradleException('Particle RT prebuilt layout contract mismatch')
        if (metadata.abi != contract.constants.ABI || metadata.source_sha256 != digest.digest().encodeHex().toString()
                || metadata.dll_sha256 != binaryDigest || !metadata.embedded_device_programs) {
            throw new GradleException('Particle RT prebuilt release does not match native sources; rebuild and publish the DLL.')
        }
        def versionText = nativeVersion.getText('UTF-8')
        def version = (versionText =~ /#define CMI_RT_VERSION "([0-9.]+)"/)[0][1]
        if (metadata.version != version) throw new GradleException('Particle RT native version mismatch')
        def output = nativeResources.get().dir('native/particle-rt/windows-x86_64').asFile
        output.mkdirs()
        java.nio.file.Files.copy(dll.toPath(), new File(output, 'CmiParticleRt.dll').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        new File(output, 'release.properties').setText("version=${version}\nabi=${contract.constants.ABI}\n", 'UTF-8')
    }
}
tasks.named('processResources') {
    dependsOn(prepareParticleRtResources)
    from(nativeResources)
}
