apply from: file('gradle/hexal.gradle')

// All external coordinates are declared once; dependency scopes are assigned below.
// Mods with a public Maven use that project's own GAV and a readable version.
// The remaining mods only publish to CurseForge/Modrinth, so they stay pinned by
// the platform file/version ID; gradle.properties names the version beside each ID.
ext.cmiCoordinates = [
        // First-party Maven repositories (see gradle/repositories.gradle).
        create: "com.simibubi.create:create-${minecraft_version}:${create_version}",
        flywheel: "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}",
        registrate: "com.tterrag.registrate:Registrate:${registrate_version}",
        ponder: "net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}",
        sable: "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}",
        sodium: "net.caffeinemc:sodium-neoforge:${sodium_version}",
        glslTransformer: "io.github.douira:glsl-transformer:${glsl_transformer_version}",
        jei: "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}",
        caelus: "com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}",
        patchouli: "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-NEOFORGE",
        clothConfig: "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}",
        architectury: "dev.architectury:architectury-neoforge:${architectury_version}",
        kotlinForForge: "curse.maven:kotlin-for-forge-351264:${kotlin_for_forge_file_id}",
        arsNouveau: "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}",
        curios: "top.theillusivec4.curios:curios-neoforge:${curios_version}",
        geckolib: "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}",
        accessories: "io.wispforest:accessories-neoforge:${accessories_version}",
        forgifiedFabricApi: "org.sinytra.forgified-fabric-api:forgified-fabric-api:${forgified_fabric_api_version}",
        owo: "codeberg.master_bw3.trickster:owo-lib-neoforge:${owo_version}@jar",
        modlauncher: "cpw.mods:modlauncher:${modlauncher_version}",
        connector: "org.sinytra:connector:${connector_version}",
        fabricApi: "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}",
        fabricLoader: "net.fabricmc:fabric-loader:${fabric_loader_version}",
        vavr: "io.vavr:vavr:${vavr_version}",
        endec: "io.wispforest:endec:${endec_version}",
        junit: "org.junit:junit-bom:${junit_version}",
        kotlinStdlib: "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}",

        // No public Maven yet: keep the CurseForge/Modrinth mirrors.
        veil: "maven.modrinth:3KUWeVhG:${veil_version_id}",
        iris: "curse.maven:irisshaders-455508:${iris_file_id}",
        irisVeil: "curse.maven:iris-veil-compat-1541252:${iris_veil_file_id}",
        hexparse: "maven.modrinth:WjFyIzFj:${hexparse_version_id}",
        inline: "curse.maven:inline-971167:${inline_file_id}",
        bitsAndBobs: "maven.modrinth:T8bvmqVZ:${bits_and_bobs_version_id}",
        azimuth: "curse.maven:azimuth-api-1466331:${azimuth_file_id}",
        strutYourStuff: "curse.maven:strut-your-stuff-1486746:${strut_your_stuff_file_id}",
        lithostitched: "curse.maven:lithostitched-936015:${lithostitched_file_id}",
        trickster: "curse.maven:trickster-${trickster_project_id}:${trickster_file_id}",
        cicada: "curse.maven:cicada-989574:${cicada_file_id}",
        lavender: "curse.maven:lavender-api-962916:${lavender_file_id}",
        cardinalComponents: "curse.maven:cardinal-components-api-318449:${cardinal_components_file_id}"
].plus(cmiHexalCoordinates).asImmutable()

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // ModDev wires Minecraft to main; JVM tests also need that generated classpath.
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
    tricksterLocalRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // These mods are optional for installed CMI and share the development runtime.
    hexcastingLocalRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    hexalLocalRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    localRuntime.extendsFrom hexcastingLocalRuntime, hexalLocalRuntime
    testRuntimeClasspath.extendsFrom tricksterLocalRuntime
}

apply from: file('gradle/optional-apis.gradle')
apply from: file('gradle/voxy.gradle')

def coordinates = cmiCoordinates
def remapped = gradle.ext.cmiRemappedLibraries

// CurseForge/Modrinth jars have no POM. Mods moved to their own Maven do, so their
// published transitive mod dependencies must be suppressed to keep the development
// runtime and the published module metadata identical to the pinned binaries.
def firstPartyMaven = ['create', 'sable', 'sodium', 'caelus', 'patchouli', 'clothConfig',
                       'architectury', 'arsNouveau', 'curios', 'geckolib',
                       'accessories', 'forgifiedFabricApi'] as Set
def declare = { String scope, String key ->
    if (key in firstPartyMaven) {
        dependencies.add(scope, coordinates[key]) { transitive = false }
    } else {
        dependencies.add(scope, coordinates[key])
    }
}
dependencies {
    declare('implementation', 'create')
    implementation coordinates.inline
    implementation coordinates.azimuth
    declare('implementation', 'forgifiedFabricApi')

    // Optional integrations are available in development, not required by Maven consumers.
    ['veil', 'arsNouveau', 'bitsAndBobs', 'jei'].each { key ->
        declare('compileOnly', key)
        declare('localRuntime', key)
    }
    ['sable', 'flywheel', 'registrate', 'ponder', 'iris', 'glslTransformer',
     'irisVeil', 'hexparse', 'modlauncher', 'connector', 'vavr', 'endec'].each { key ->
        declare('compileOnly', key)
    }
    // GLSL transformer is supplied by Iris/Veil compatibility at runtime; never bundle it.
    compileOnly(coordinates.owo) { transitive = false }

    compileOnly coordinates.hexcasting
    compileOnly coordinates.hexal
    // The bytecode contract check reads Hexal's prepared jar without launching Minecraft.
    testRuntimeOnly coordinates.hexal
    hexcastingLocalRuntime coordinates.hexcasting
    hexcastingLocalRuntime coordinates.paucal
    //hexalLocalRuntime coordinates.hexal
    hexalLocalRuntime coordinates.moreiotas

    ['caelus', 'patchouli', 'clothConfig', 'architectury', 'kotlinForForge',
     'curios', 'geckolib', 'strutYourStuff', 'accessories', 'lithostitched'].each { key ->
        declare('localRuntime', key)
    }
    localRuntime(coordinates.owo) { transitive = false }
    ['cicada', 'lavender', 'cardinalComponents'].each { key -> runtimeOnly coordinates[key] }
    tricksterLocalRuntime coordinates.trickster

    // Connector and the bootstrap service must be visible before mod discovery.
    additionalRuntimeClasspath coordinates.connector
    additionalRuntimeClasspath files(tasks.named('bootstrapJar'))
    if (remapped.useCache) {
        compileOnly files(remapped.artifacts.values())
    } else {
        compileOnly project(path: ':loom-remap', configuration: 'namedFabricApi')
        compileOnly project(path: ':loom-remap', configuration: 'namedTrickster')
    }

    testImplementation platform(coordinates.junit)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation sourceSets.bootstrap.output
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly coordinates.modlauncher
    testRuntimeOnly coordinates.glslTransformer
    // Inspect real APIs/bytecode without initializing the optional mods.
    testRuntimeOnly(coordinates.ponder) { transitive = false }
    testRuntimeOnly(coordinates.iris) { transitive = false }
    testRuntimeOnly(coordinates.irisVeil) { transitive = false }
}
