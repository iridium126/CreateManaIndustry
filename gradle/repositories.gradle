repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = "TricksterOwoRelease"
                url = uri("https://codeberg.org/master_bw3/trickster/releases/download/${owo_release}/")
                patternLayout {
                    artifact "[artifact]-[revision].[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule "codeberg.master_bw3.trickster", "owo-lib-neoforge"
        }
    }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    // Each mod repository below excludes every other repository for the groups it
    // publishes. A plain content filter still makes Gradle probe the earlier
    // repositories first, and it re-probes them once the 24 hour cache of a missing
    // module expires, so a cold build pays a pointless round trip per module and host.
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
            includeGroup 'com.hollingsworth.ars_nouveau'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Shedaniel'
                url = 'https://maven.shedaniel.me/'
            }
        }
        filter { includeGroup 'me.shedaniel.cloth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev/'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TheIllusiveC4'
                url = 'https://maven.theillusivec4.top/'
            }
        }
        filter {
            includeGroup 'top.theillusivec4.curios'
            includeGroup 'com.illusivesoulworks.caelus'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter { includeGroup 'dev.ryanhcode.sable' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Caffeinemc'
                url = 'https://maven.flashyreese.me/releases'
            }
        }
        filter { includeGroup 'net.caffeinemc' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'SinytraReleases'
                url = 'https://maven.su5ed.dev/releases'
            }
        }
        filter { includeGroup 'org.sinytra.forgified-fabric-api' }
    }
    // Not exclusive: org.sinytra.forgified-fabric-api shares the group prefix but is
    // only published to SinytraReleases, and exclusive filters cannot exclude a module.
    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
        content { includeGroupByRegex 'org\\.sinytra(\\..*)?' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Create"
                url = "https://maven.createmod.net"
            }
        }
        filter {
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'net.createmod.ponder'
            includeGroup 'com.simibubi.create'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Ithundxr"
                url = "https://maven.ithundxr.dev/snapshots"
            }
        }
        filter { includeModule 'com.tterrag.registrate', 'Registrate' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Fabric"
                url = "https://maven.fabricmc.net/"
            }
        }
        filter { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "WispForest"
                url = "https://maven.wispforest.io/releases"
            }
        }
        filter { includeGroup 'io.wispforest' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// ModDevGradle registers its Minecraft/NeoForged repositories while the plugin is
// applied, so they end up ahead of every repository declared above. Two of them use
// maven.neoforged.net, which is unreachable on some networks: lookups that reach it
// wait for the full connect timeout, and the timeout aborts the whole resolution
// instead of falling through to the next repository. Keeping CMI's repositories first
// lets every module they host be answered before that probe, so configuration and
// configuration-cache storage stay offline-fast on such networks.
project.afterEvaluate {
    def modDevRepositories = ['Mojang Meta', 'Mojang Minecraft Libraries', 'NeoForged Releases'] as Set
    def cmiRepositories = repositories.findAll { !(it.name in modDevRepositories) }
    cmiRepositories.reverseEach { repository ->
        repositories.remove(repository)
        repositories.add(0, repository)
    }
}
