gradle.projectsEvaluated {
    def p = gradle.rootProject
    p.apply from: p.file('scripts/testing/common.gradle')
    p.configureCmiGameTests(name: 'allaystorm', sources: 'src/test/gametest/allaystorm/java',
            structure: 'storm_combat_test', size: 8, trickster: false)
    if (p.hasProperty('domeEvidence')) {
        p.tasks.named('runGameTestServer', JavaExec).configure {
            systemProperty 'cmi.dome.evidence', p.file(p.property('domeEvidence')).absolutePath
        }
    }
}
