// Real Create machine output, environment and native recovery tests.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    p.apply from: p.file('scripts/testing/common.gradle')
    def recovery = p.hasProperty('packageRecoveryGameTest')
    def suite = p.configureCmiGameTests(name: 'packages', sources: 'src/test/gametest/packages/java',
            structure: 'package_output_test')
    suite.java.exclude(recovery ? '**/PackageOutputGameTests.java' : '**/PackageRecoveryGameTests.java')
    if (recovery) suite.java.exclude('**/PackageEnvironmentGameTests.java')
    def audit = p.tasks.register('packageEnvironmentAuditFixture', Copy) {
        dependsOn 'preparePackageNativeAudit'
        from(p.file('docs/package-environment-native-inventory.json'))
        into(p.layout.buildDirectory.dir('gametest/packages-audit-resources'))
    }
    suite.resources.srcDir(audit)
    def runDir = p.file('build/gametest/packages')
    def defaults = new File(runDir, 'defaultconfigs/createmanaindustry-server.toml')
    def config = new File(runDir, 'world/serverconfig/createmanaindustry-server.toml')
    p.tasks.named('runGameTestServer', JavaExec).configure {
        doFirst {
            for (target in [defaults, config]) {
                target.parentFile.mkdirs()
                target.text = '[gpuPackages]\nauthorityEnabled = ' + (!recovery) + '\n'
            }
        }
    }
}
