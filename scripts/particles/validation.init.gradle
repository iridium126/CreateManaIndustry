                    def validationSources=fileTree('scripts/particles') { include '**/*.java','**/*.gradle','**/*.py' }
                    def metadata = [task: name, arguments: args, properties: project.gradle.startParameter.projectProperties,
                            startedAt: java.time.Instant.now().toString(),
                            gpuJavaSha256: fingerprint(gpuJava), shaderSha256: fingerprint(gpuShaders),
                            packageServerJavaSha256: fingerprint(packageServerJava),
                            validationSha256: fingerprint(validationSources),
                            baselineSha256: file((findProperty('packageEnvironmentBaseline') ?: 'build/package-environment-baseline') + '/java').exists()
                                    ? fingerprint(fileTree(findProperty('packageEnvironmentBaseline') ?: 'build/package-environment-baseline') { include 'java/*.java','assets/**/*' }) : null,
