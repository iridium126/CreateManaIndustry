                        def output = process.inputStream.getText('UTF-8').trim()
                        process.waitFor() == 0 ? output : 'unavailable'
                    }
                    def fingerprint = { files ->
                        def digest=java.security.MessageDigest.getInstance('SHA-256')
                        files.files.findAll { it.isFile() }.sort { a,b -> a.path <=> b.path }.each { input ->
                            digest.update(rootDir.toPath().relativize(input.toPath()).toString().replace('\\','/').getBytes('UTF-8'))
                            digest.update((byte)0)
                            input.withInputStream { stream ->
                                byte[] block=new byte[16384];int length
                                while((length=stream.read(block))!=-1)digest.update(block,0,length)
                            }
                        }
                        java.util.HexFormat.of().formatHex(digest.digest())
