// Explicit development-client diagnostic overlay. Ordinary builds never use it.
// First run Install-R7.ps1 without -InstallMod; do not put the distribution in
// the development run/mods directory (main is already a development mod).
allprojects { afterEvaluate {
    if(!project.hasProperty('r7DiagnosticJar'))throw new GradleException('Pass -Pr7DiagnosticJar=<qualified diagnostic distribution>')
    def distribution=file(project.property('r7DiagnosticJar'))
    def overlay=layout.buildDirectory.dir('r7-qualified-client-resources')
    def prepare=tasks.register('prepareR7QualifiedClientResources') {
        inputs.file(distribution);outputs.dir(overlay)
        doLast {
            def outer=new java.util.zip.ZipFile(distribution)
            try {
                def innerBytes=outer.getInputStream(outer.getEntry('META-INF/jars/createmanaindustry.jar')).readAllBytes()
                def inner=new java.util.zip.ZipInputStream(new ByteArrayInputStream(innerBytes));byte[] receipt=null;def entry
                try {while((entry=inner.nextEntry)!=null)if(entry.name=='cmi-r7-admission.json'){receipt=inner.readAllBytes();break}}finally{inner.close()}
                if(receipt==null)throw new GradleException('No qualified R7 receipt in diagnostic distribution')
                def target=overlay.get().file('cmi-r7-admission.json').asFile;target.parentFile.mkdirs();target.bytes=receipt
            } finally {outer.close()}
        }
    }
    sourceSets.main.output.dir([builtBy:prepare],overlay)
    tasks.matching { it.name=='runClient' }.configureEach {dependsOn prepare}
} }
