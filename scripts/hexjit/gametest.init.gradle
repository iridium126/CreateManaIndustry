// Isolated Hex JIT tests and benchmark scenarios.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    p.apply from: p.file('scripts/testing/common.gradle')
    p.dependencies.add('localRuntime', 'maven.modrinth:WjFyIzFj:fFV6HwT2')
    p.dependencies.add('localRuntime', 'maven.modrinth:PkhtCPsD:I3vfDCiE')
    p.dependencies.add('compileOnly', 'org.jetbrains.kotlin:kotlin-stdlib:2.3.0')
    p.configureCmiGameTests(name: 'hexjit', sources: 'src/test/gametest/hexjit/java', structure: 'hex_jit_test')
    p.neoForge.runs.gameTestServer.systemProperty('mixin.debug.verbose', 'true')
    p.neoForge.runs.gameTestServer.systemProperty('mixin.debug.export', 'true')
    p.neoForge.runs.gameTestServer.systemProperty('mixin.debug.export.filter', 'at.petrak.hexcasting.*')
    p.neoForge.runs.gameTestServer.systemProperty('hexjit.jfr.dir', p.layout.buildDirectory.dir('hexjit-jfr').get().asFile.absolutePath)
    p.neoForge.runs.gameTestServer.systemProperty('hexjit.steadySamples', p.findProperty('hexjitSteadySamples') ?: '9')
    p.neoForge.runs.gameTestServer.systemProperty('hexjit.soundAblationSamples', p.findProperty('hexjitSoundAblationSamples') ?: '5')
}
