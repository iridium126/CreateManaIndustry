// Opt-in offline mathematical rendering. No game launch, assets or production shaders are changed.
gradle.projectsEvaluated {
    def p=gradle.rootProject
    p.tasks.register('renderJuliaOffline', JavaExec) {
        classpath=p.sourceSets.main.runtimeClasspath+p.configurations.compileClasspath
        mainClass='scripts/art/JuliaOfflineRender.java'
        workingDir=p.projectDir
        jvmArgs '-Xmx2g'
    }
}
