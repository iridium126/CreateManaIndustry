gradle.projectsEvaluated {
    def p = gradle.rootProject
    def fixture = p.file('run/mods/ysm-2.6.5-neoforge+mc1.21.1-release.jar')
    if (!fixture.isFile()) throw new GradleException('Local YSM 2.6.5 fixture is required')
    p.apply from: p.file('scripts/testing/common.gradle')
    p.dependencies.add('localRuntime', p.files(fixture))
    def suite = p.configureCmiGameTests(name: 'ysm', sources: 'src/test/gametest/ysm/java',
            resources: 'build/allvr-worldgen-test-resources-vanilla')
    if (System.getProperty('cmi.ysm.dataOnly') == 'true') suite.java.exclude('**/YsmRuntimeGameTests.java')
    p.neoForge.runs.gameTestServer.systemProperty('cmi.ysm.fixture', fixture.absolutePath)
    def runtimeHome = System.getProperty('cmi.ysm.javaHome')
    if (runtimeHome != null) {
        p.tasks.named('runGameTestServer', JavaExec) {
            javaLauncher.set((org.gradle.jvm.toolchain.JavaLauncher) null)
            executable = new File(runtimeHome, 'bin/java.exe').absolutePath
        }
    }
}
