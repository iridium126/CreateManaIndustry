gradle.projectsEvaluated {
    def project = gradle.rootProject
    def owo = project.file('run/mods/owo-lib-neoforge-0.13.0-alpha.15+1.21.jar')
    if (!owo.isFile()) {
        throw new GradleException("Missing local Owo runtime dependency: ${owo}")
    }
    project.dependencies.add('localRuntime', project.files(owo))
    project.sourceSets.main.java.srcDir(project.file('src/test/gametest/hexparse-absent/java'))
    def resources = project.layout.buildDirectory.dir('hexparse-absent-test-resources').get().asFile
    project.sourceSets.main.resources.srcDir(resources)
    def fixtures = project.tasks.register('hexParseAbsentGameTestFixtures') {
        outputs.dir(resources)
        doLast {
            def target = new File(resources, 'data/createmanaindustry/structure/worldgen_test.nbt')
            target.parentFile.mkdirs()
            target.withOutputStream { file ->
                def out = new DataOutputStream(new java.util.zip.GZIPOutputStream(file))
                out.writeByte(10); out.writeUTF('')
                out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                3.times { out.writeInt(1) }
                out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                ['blocks', 'entities'].each { name -> out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0) }
                out.writeByte(0); out.close()
            }
        }
    }
    project.tasks.named('processResources').configure { dependsOn(fixtures) }
    project.neoForge.runs.gameTestServer.gameDirectory = project.file('build/hexparse-absent-test-run')
    project.tasks.named('runGameTestServer', JavaExec).configure { maxHeapSize = '3g' }
}
