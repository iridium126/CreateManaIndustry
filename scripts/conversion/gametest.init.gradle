// Use -PconversionAbsent=hexcasting or trickster for absence probes.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def absent = p.findProperty('conversionAbsent') ?: 'none'
    if (!(absent in ['none', 'hexcasting', 'trickster'])) throw new GradleException('Unknown conversionAbsent mod')
    p.apply from: p.file('scripts/testing/common.gradle')
    p.configureCmiGameTests(name: "conversion-${absent}",
            sources: absent == 'none' ? 'src/test/gametest/conversion/java' : 'src/test/gametest/conversion-absent/java',
            structure: 'conversion_test', trickster: absent != 'trickster')
    if (absent == 'hexcasting') p.configurations.runtimeClasspath.exclude(group: 'hexcasting')
    p.neoForge.runs.gameTestServer.systemProperty('conversion.absent', absent)
}
