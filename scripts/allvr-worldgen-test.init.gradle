// Prepare the selected pack with scripts/prepare-allvr-worldgen-test.py first.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def mode = p.findProperty('allvrTestPack') ?: 'vanilla'
    if (!(mode in ['vanilla', 'terralith'])) throw new GradleException('allvrTestPack must be vanilla or terralith')
    p.apply from: p.file('scripts/testing/common.gradle')
    p.configureCmiGameTests(name: "worldgen-${mode}", sources: 'src/test/gametest/worldgen/java',
            resources: "build/allvr-worldgen-test-resources-${mode}")
    p.neoForge.runs.gameTestServer.systemProperty('allvr.testTerralith', (mode == 'terralith').toString())
}
